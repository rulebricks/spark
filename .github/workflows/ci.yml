name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    # Python 3.9 binaries are unavailable on newer ubuntu-latest images.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and tooling
        run: python -m pip install -e ".[dev]"

      - name: Validate project metadata
        run: validate-pyproject pyproject.toml

      - name: Lint and type check
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          mypy src

      - name: Run unit and Spark integration tests
        run: python -m pytest -m "not requires_network" -q

      - name: Validate notebooks and documentation
        run: |
          python scripts/validate_notebooks.py
          python scripts/validate_docs.py

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python scripts/check_distribution.py dist/*
