name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run non-Spark tests
        run: pytest -m "not requires_spark and not requires_network" -q

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate project metadata
        run: validate-pyproject pyproject.toml

      - name: Lint and type check
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          mypy src

      - name: Run unit tests
        run: pytest -m "not requires_spark and not requires_network" -q

      - name: Run Spark integration tests
        run: pytest -m "requires_spark and not requires_network" -q

      - name: Validate notebooks
        run: |
          python scripts/validate_notebooks.py
          python scripts/validate_docs.py

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python scripts/check_distribution.py dist/*
