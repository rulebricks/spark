name: Release to PyPI

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

jobs:
  test:
    name: Run release quality gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build "twine>=7"

      - name: Build sdist and wheel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RULEBRICKS_SPARK="${RELEASE_TAG#v}"
          python -m build

      - name: Verify metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m twine check dist/*
          python scripts/check_distribution.py --expected-version "$RELEASE_TAG" dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/rulebricks-spark/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
