[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rulebricks-spark"
dynamic = ["version"]
description = "A Rulebricks decision-based data processing client for Apache Spark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Rulebricks", email = "support@rulebricks.com" },
]
keywords = [
    "rulebricks",
    "spark",
    "pyspark",
    "databricks",
    "rules-engine",
    "decision-tables",
    "business-rules",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "rulebricks>=2.6.8,<3",
    "httpx>=0.28,<1",
    "pyspark>=3.5,<3.6",
    "pandas>=2,<3",
    "pyarrow>=18,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=7.0",
    "nbformat>=5.10",
    "validate-pyproject>=0.23",
]

[project.urls]
Homepage = "https://rulebricks.com"
Documentation = "https://github.com/rulebricks/spark#readme"
Repository = "https://github.com/rulebricks/spark"
Issues = "https://github.com/rulebricks/spark/issues"

[tool.hatch.version]
path = "src/rulebricks_spark/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rulebricks_spark"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rulebricks_spark",
    "tests",
    "examples",
    "docs",
    "scripts",
    "assets",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".readthedocs.yaml",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_spark: tests that need a running Spark session",
    "requires_network: tests that hit the Rulebricks API",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
